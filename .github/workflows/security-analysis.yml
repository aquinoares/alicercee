name: Security analysis

on:
  push:
    branches: [main, feat/alicia-edge-tts-autonomia-20261101, feat/alicia-contexto-financeiro-40-exemplos-20261101, feat/alicia-realidade-financeira-dimensoes-v1]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL JavaScript and TypeScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
          build-mode: none
      - name: Analyze code
        uses: github/codeql-action/analyze@v4
