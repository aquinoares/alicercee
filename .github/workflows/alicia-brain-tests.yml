name: Alicia Brain Tests

on:
  pull_request:
    paths:
      - "assets/alicia-brain.js"
      - "tests/alicia-brain.test.mjs"
      - "supabase/functions/alicia-safety-alert/index.ts"
      - "package.json"
      - ".github/workflows/alicia-brain-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-local-brain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Alicia brain tests
        run: npm run test:brain
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check safety alert Edge Function
        run: deno check supabase/functions/alicia-safety-alert/index.ts
