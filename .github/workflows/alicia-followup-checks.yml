name: Alicia debt and appointment follow-up checks

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "assets/alicia-debt-followup.js"
      - "assets/alicia-cashflow.js"
      - "assets/alicia-analitica.js"
      - "assets/alicerce-beneficios.js"
      - "assets/beneficios-premium.css"
      - "assets/alicia-compra-beneficio-chat.js"
      - "assets/alicia-guia-carrossel.js"
      - "assets/alicia-contextual.js"
      - "tests/alicia-debt-followup.test.mjs"
      - "tests/alicia-cashflow.test.mjs"
      - "tests/alicia-analitica.test.mjs"
      - "tests/alicerce-beneficios.test.mjs"
      - "tests/alicerce-compra-beneficio.test.mjs"
      - "tests/alicia-compra-beneficio-chat.test.mjs"
      - "tests/alicerce-beneficios-correcao.test.mjs"
      - "tests/alicia-guia-carrossel.test.mjs"
      - "tests/alicia-contextual.test.mjs"
      - ".github/workflows/alicia-followup-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alicia-followup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Alicia follow-up tests
        run: node --test tests/alicia-debt-followup.test.mjs tests/alicia-cashflow.test.mjs tests/alicia-analitica.test.mjs tests/alicerce-beneficios.test.mjs tests/alicerce-compra-beneficio.test.mjs tests/alicia-compra-beneficio-chat.test.mjs tests/alicerce-beneficios-correcao.test.mjs tests/alicia-guia-carrossel.test.mjs tests/alicia-contextual.test.mjs
