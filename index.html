/* ============================================================
   ALICERCE v2.1 — "Meu Mês" · i18n completo (PT / EN / ES)
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0B0F14;--panel:#141A22;--panel2:#1A222C;--border:#232C37;
  --gold:#D4A859;--gold2:#E2B46A;--text:#F8F9FA;--text2:#9CA3AF;
  --green:#22C55E;--red:#EF4444;--blue:#60A5FA;--purple:#A78BFA;--orange:#FB923C;
}
[data-theme="emerald"]{--bg:#06100E;--panel:#0E1B18;--panel2:#12241F;--border:#1B2E29;--gold:#C9A85C;--gold2:#E5C97E;--text:#E4EDE8;--text2:#8FA69E;--green:#34C38F;--red:#E58B7B;}
[data-theme="pearl"]{--bg:#F7F4EE;--panel:#FFFFFF;--panel2:#EFEAE1;--border:#E4DED2;--gold:#8A6A3F;--gold2:#B79F7A;--text:#1C1B19;--text2:#6B665C;--green:#2F8F68;--red:#C4564A;}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;transition:background .4s,color .4s}
#app{max-width:430px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:110px}
.serif{font-family:'Playfair Display',serif}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;color:var(--text);background:var(--bg);border:1.5px solid var(--border);border-radius:13px;padding:13px 14px;font-size:15px;width:100%;outline:none;transition:border .2s}
input:focus,select:focus{border-color:var(--gold)}
input::placeholder{color:var(--text2);opacity:.6}
::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.05em;border:1px solid var(--border);background:var(--panel2);color:var(--text2)}
.pill.gold{border-color:color-mix(in srgb,var(--gold) 45%,transparent);background:color-mix(in srgb,var(--gold) 14%,transparent);color:var(--gold2)}
.pill.red{border-color:color-mix(in srgb,var(--red) 40%,transparent);background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red)}
.pill.green{border-color:color-mix(in srgb,var(--green) 40%,transparent);background:color-mix(in srgb,var(--green) 12%,transparent);color:var(--green)}
.card-sh{background:var(--panel);border:1px solid var(--border);border-radius:18px;box-shadow:0 10px 28px rgba(0,0,0,.22)}
.press{transition:transform .15s ease}
.press:active{transform:scale(.96)}
.section-title{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--text2)}
.money-pos{color:var(--green)} .money-neg{color:var(--red)}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding:6px 22px 12px;margin:0 -22px;cursor:grab}
.carousel.dragging{cursor:grabbing;scroll-behavior:auto}
.carousel>*{scroll-snap-align:center;flex:0 0 76%;user-select:none}
.carousel.wide>*{flex-basis:88%}
.carousel.slim>*{flex-basis:44%}
.dots{display:flex;justify-content:center;gap:6px;margin-top:2px}
.dot{width:6px;height:6px;border-radius:99px;background:var(--border);transition:all .3s}
.dot.on{width:20px;background:var(--gold)}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:14px 20px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.logo{display:flex;align-items:center;gap:9px}
.logo-badge{width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,var(--gold),#8a6a2f);display:grid;place-items:center;box-shadow:0 6px 18px color-mix(in srgb,var(--gold) 35%,transparent)}
.avatar{width:37px;height:37px;border-radius:999px;background:var(--panel2);border:1px solid var(--border);display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--gold2)}
.hero{position:relative;border-radius:22px;padding:20px;background:linear-gradient(155deg,#17202B 0%,#101720 55%,#241B10 100%);border:1px solid color-mix(in srgb,var(--gold) 26%,transparent);overflow:hidden}
.hero::before{content:"";position:absolute;width:220px;height:220px;right:-80px;top:-100px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--gold) 28%,transparent),transparent 70%)}
.hero-label{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#B9A98A}
.hero-value{font-size:40px;font-weight:900;letter-spacing:-1.8px;margin-top:5px;line-height:1}
.hero-sub{font-size:12px;color:#A79B87;margin-top:8px;font-weight:500}
.mini3{display:flex;gap:8px;margin-top:15px}
.mini{flex:1;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:11px 10px}
.mini .lb{font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.72}
.mini .vl{font-size:15.5px;font-weight:800;letter-spacing:-.4px;margin-top:4px}
.act-row{display:flex;gap:9px;margin-top:16px}
.act{flex:1;border-radius:17px;padding:15px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:800;border:1.5px solid var(--border);background:var(--panel);transition:transform .15s}
.act:active{transform:scale(.94)}
.act .em{font-size:23px}
.act.green{border-color:color-mix(in srgb,var(--green) 45%,transparent);background:color-mix(in srgb,var(--green) 11%,transparent)}
.act.red{border-color:color-mix(in srgb,var(--red) 45%,transparent);background:color-mix(in srgb,var(--red) 11%,transparent)}
.act.gold{border-color:color-mix(in srgb,var(--gold) 50%,transparent);background:color-mix(in srgb,var(--gold) 13%,transparent)}
.act.blue{border-color:color-mix(in srgb,var(--blue) 45%,transparent);background:color-mix(in srgb,var(--blue) 11%,transparent)}
.tx{display:flex;align-items:center;gap:12px;padding:13px;border-radius:15px;background:var(--panel2);border:1px solid var(--border);transition:transform .15s}
.tx:active{transform:scale(.98)}
.tx-ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:18px;flex-shrink:0}
.tx-title{font-size:14.5px;font-weight:800;letter-spacing:-.1px}
.tx-meta{font-size:11px;color:var(--text2);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tx-amt{font-size:15px;font-weight:900;white-space:nowrap;letter-spacing:-.3px}
.pay-btn{width:38px;height:38px;border-radius:12px;border:1.5px solid var(--border);display:grid;place-items:center;font-size:16px;flex-shrink:0;transition:all .2s}
.pay-btn.on{background:color-mix(in srgb,var(--green) 18%,transparent);border-color:var(--green)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
.cal-dow{text-align:center;font-size:9.5px;font-weight:800;letter-spacing:.08em;color:var(--text2);padding:4px 0}
.cal-cell{position:relative;aspect-ratio:1/1.08;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:700;background:var(--panel2);border:1.5px solid transparent;transition:all .18s}
.cal-cell.muted{opacity:.3}
.cal-cell.today{border-color:var(--gold)}
.cal-cell.sel{background:var(--gold);color:#1a1206;transform:scale(1.07)}
.cal-cell .dotrow{display:flex;gap:2.5px;height:5px;align-items:center}
.mdot{width:4.5px;height:4.5px;border-radius:99px}
.star{font-size:8px;line-height:1}
.dcard{border-radius:18px;padding:17px;background:var(--panel);border:1px solid var(--border)}
.pbar{height:7px;border-radius:99px;background:var(--border);overflow:hidden}
.pbar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);z-index:60;display:flex;justify-content:space-around;align-items:flex-end;padding:9px 10px calc(13px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 93%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--border)}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:14px;color:var(--text2);transition:all .25s}
.navbtn .ic{font-size:20px;transition:transform .25s}
.navbtn .lb{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.navbtn.on{color:var(--gold2);background:color-mix(in srgb,var(--gold) 12%,transparent)}
.navbtn.on .ic{transform:translateY(-2px) scale(1.12)}
.fab{position:fixed;bottom:calc(28px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:62px;height:62px;border-radius:23px;z-index:70;background:linear-gradient(150deg,var(--gold2),#96702c);color:#1a1206;font-size:30px;font-weight:700;display:grid;place-items:center;box-shadow:0 14px 34px color-mix(in srgb,var(--gold) 45%,transparent);transition:transform .2s}
.fab:active{transform:translateX(-50%) scale(.9) rotate(90deg)}
.sheet-wrap{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .28s}
.sheet-wrap.open{opacity:1;pointer-events:auto}
.sheet{width:min(430px,100%);max-height:90vh;overflow-y:auto;background:var(--panel);border-radius:26px 26px 0 0;border:1px solid var(--border);padding:10px 20px calc(26px + env(safe-area-inset-bottom));transform:translateY(40px);transition:transform .32s cubic-bezier(.2,.9,.25,1)}
.sheet-wrap.open .sheet{transform:translateY(0)}
.handle{width:42px;height:4px;border-radius:99px;background:var(--border);margin:8px auto 14px}
.sheet-title{font-size:20px;font-weight:800;letter-spacing:-.3px}
.sheet-sub{font-size:12px;color:var(--text2);margin:3px 0 16px;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:14px 18px;border-radius:15px;font-size:14px;font-weight:800;transition:all .18s;border:1.5px solid var(--border);background:var(--panel2)}
.btn:active{transform:scale(.97)}
.btn-gold{background:linear-gradient(145deg,var(--gold2),#96702c);color:#1a1206;border-color:transparent;box-shadow:0 10px 24px color-mix(in srgb,var(--gold) 32%,transparent)}
.btn-ghost{background:transparent}
.btn-danger{background:color-mix(in srgb,var(--red) 12%,transparent);border-color:color-mix(in srgb,var(--red) 35%,transparent);color:var(--red)}
.btn-block{width:100%}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);margin-bottom:8px}
.valor-big{font-size:32px;font-weight:900;letter-spacing:-1px;text-align:center;border-radius:16px;padding:15px 12px}
.chip{padding:10px 15px;border-radius:13px;border:1.5px solid var(--border);background:var(--panel2);font-size:13.5px;font-weight:700;color:var(--text2);transition:all .2s;white-space:nowrap}
.chip.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 15%,transparent);color:var(--gold2)}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding:2px 22px 10px;margin:0 -22px}
.hscroll::-webkit-scrollbar{display:none}
.hchip{flex:0 0 auto}
.toggle{width:52px;height:30px;border-radius:99px;background:var(--border);position:relative;transition:.25s;flex-shrink:0}
.toggle.on{background:var(--gold)}
.toggle>span{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:99px;background:#fff;transition:.25s}
.toggle.on>span{left:25px}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(16px);z-index:200;background:var(--panel);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);padding:12px 18px;border-radius:14px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:all .3s;box-shadow:0 14px 34px rgba(0,0,0,.4);max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;padding:26px 22px calc(30px + env(safe-area-inset-bottom));position:relative;overflow:hidden;background:linear-gradient(170deg,#0B0F14 30%,#1c1509 100%)}
.login-glow{position:absolute;width:340px;height:340px;left:50%;top:-60px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--gold) 26%,transparent),transparent 70%)}
.login-word{position:absolute;top:13%;left:0;right:0;text-align:center;font-size:62px;font-weight:800;letter-spacing:-.08em;color:rgba(255,255,255,.05);user-select:none}
/* arte do calendário no login */
.login-art{position:relative;height:215px;margin:16px 0 0}
.art-cal{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:236px;padding:15px;border-radius:20px;background:rgba(255,255,255,.055);border:1px solid rgba(212,168,89,.28);box-shadow:0 22px 50px rgba(0,0,0,.42);animation:floaty 5.5s ease-in-out infinite;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.art-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:11px}
.art-cell{aspect-ratio:1/1;border-radius:7px;background:rgba(255,255,255,.07);display:grid;place-items:center;font-size:8.5px;font-weight:700;color:rgba(255,255,255,.55);position:relative}
.art-cell.gold{background:rgba(212,168,89,.75);color:#1a1206}
.art-cell.ghost{opacity:.22}
.art-cell .adot{position:absolute;bottom:3px;width:3.5px;height:3.5px;border-radius:99px}
.art-chip{position:absolute;padding:9px 13px;border-radius:13px;background:rgba(20,26,34,.92);border:1px solid rgba(212,168,89,.35);font-size:11px;font-weight:700;box-shadow:0 14px 32px rgba(0,0,0,.42);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);white-space:nowrap}
.art-chip1{left:2%;top:24px;animation:floaty 6.4s ease-in-out .3s infinite}
.art-chip2{right:2%;top:118px;animation:floaty 7s ease-in-out .8s infinite}
.art-chip3{left:8%;top:160px;animation:floaty 6s ease-in-out .5s infinite}
@keyframes floaty{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-11px)}}
.art-chip1,.art-chip2,.art-chip3{animation-name:floaty2}
@keyframes floaty2{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
</style>
</head>

async function cloudLoad(){

    const [tx,cp,mt]=await Promise.all([
      SB.from('txs').select('id,payload').eq('user_id',uid),

  }catch(e){ return false }

function cloudPush(){
  if(!SB||!SB_USER) return;
  clearTimeout(cloudTimer);
  cloudTimer=setTimeout(async()=>{
    try{
      const uid=SB_USER.id;
      const txRows=S.txs.map(x=>{ const p=Object.assign({},x); const id=p.id; delete p.id; return {id,user_id:uid,payload:p,updated_at:new Date().toISOString()} });
      const cpRows=S.comps.map(c=>{ const p=Object.assign({},c); const id=p.id; delete p.id; return {id,user_id:uid,payload:p,updated_at:new Date().toISOString()} });
      if(txRows.length) await SB.from('txs').upsert(txRows);
      if(cpRows.length) await SB.from('comps').upsert(cpRows);
      await SB.from('meta').upsert({user_id:uid,payload:S.meta,updated_at:new Date().toISOString()});
      // limpa remotos o que foi apagado localmente
      const removed=LS.get('alicerce_removed',[])||[];
      for(const r of removed){
        if(r.t==='tx') await SB.from('txs').delete().eq('id',r.id).eq('user_id',uid);
        if(r.t==='comp') await SB.from('comps').delete().eq('id',r.id).eq('user_id',uid);
      }
      if(removed.length) LS.set('alicerce_removed',[]);
    }catch(e){ /* offline: fica salvo no aparelho e sincroniza depois */ }
  },900);
}

function faturaDateFor(dateStr,closing,due){
  const d=parseISO(dateStr); let y=d.getFullYear(), m=d.getMonth();
  if(d.getDate()>closing){ m++; if(m>11){m=0;y++} }
  const last=new Date(y,m+1,0).getDate();
  return `${y}-${pad(m+1)}-${pad(Math.min(due,last))}`;
}
function addMonths(baseStr,n,due){
  const [y0,m0]=baseStr.split('-').map(Number); let y=y0,m=m0-1+n;
  while(m>11){m-=12;y++} while(m<0){m+=12;y--}
  const last=new Date(y,m+1,0).getDate();
  return `${y}-${pad(m+1)}-${pad(Math.min(due||last,last))}`;
}

/* ============================================================
   4. CÁLCULOS DO MÊS
   ============================================================ */
function inMonth(dateStr,y,m){ if(!dateStr) return false; const d=parseISO(dateStr); return d.getFullYear()===y&&d.getMonth()===m }
function monthSummary(y,m){
  let entrou=0,gastos=0,contasPagas=0,contasTotal=0,cartoes=0,dividas=0;
  S.txs.forEach(x=>{
    const ref=x.kind==='debt'?(x.faturaDate||x.date):x.date;
    if(!inMonth(ref,y,m)) return;
    if(x.kind==='income') entrou+=x.amount;
    else if(x.kind==='expense'){
      gastos+=x.amount;
      if(x.recurring){ contasTotal+=x.amount; if(x.paid) contasPagas+=x.amount }
    }else if(x.kind==='debt'){ cartoes+=x.parcelaValor||x.amount; dividas+=x.valorTotal||x.amount }
  });
  return { entrou,gastos,contasPagas,contasTotal,cartoes,dividas,sobrou:entrou-gastos-cartoes };
}
function catBreakdown(y,m){
  const map={};
  S.txs.forEach(x=>{
    if(x.kind==='income') return;
    const ref=x.kind==='debt'?(x.faturaDate||x.date):x.date;
    if(!inMonth(ref,y,m)) return;
    const c=x.categoria||'outros';
    map[c]=(map[c]||0)+(x.kind==='debt'?(x.parcelaValor||x.amount):x.amount);
  });
  const entries=Object.entries(map).sort((a,b)=>b[1]-a[1]);
  const total=entries.reduce((s,[,v])=>s+v,0)||1;
  return entries.map(([id,val])=>({id,name:catName(id),val,pct:Math.round(val/total*100)}));
}
function monthTxList(y,m){
  return S.txs.filter(x=>{
    const ref=x.kind==='debt'?(x.faturaDate||x.date):x.date;
    return inMonth(ref,y,m);
  }).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
}

/* ============================================================
   8. CALENDÁRIO
   ============================================================ */
function viewAgenda(){
  const y=S.month.getFullYear(), m=S.month.getMonth();
  const first=new Date(y,m,1), startDow=(first.getDay()+6)%7;
  const days=new Date(y,m+1,0).getDate();
  const raw=[]; for(let i=0;i<startDow;i++) raw.push(null); for(let d=1;d<=days;d++) raw.push(d);
  const cells=raw.map(d=>d===null?null:{n:d,iso:`${y}-${pad(m+1)}-${pad(d)}`});
  const marks={};
  const add=(day,cls)=>{ (marks[day]=marks[day]||[]).push(cls) };
  S.txs.forEach(x=>{
    const ref=x.kind==='debt'?(x.faturaDate||x.date):x.date;
    if(!inMonth(ref,y,m)) return;
    add(parseInt(ref.split('-')[2]), x.kind==='income'?'pos':catOf(x.categoria).color);
  });
  S.comps.forEach(c=>{ if(inMonth(c.date,y,m)) add(parseInt(c.date.split('-')[2]),'star') });

  const selItems=S.selDay?[
    ...S.txs.filter(x=>{ const ref=x.kind==='debt'?(x.faturaDate||x.date):x.date; return ref===S.selDay||x.date===S.selDay }).map(x=>({kind:'tx',x})),
    ...S.comps.filter(c=>c.date===S.selDay).map(c=>({kind:'comp',c})),
  ]:[];
  const upcoming=[...S.comps].filter(c=>!c.done).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,8);

  return `
  <div class="card-sh" style="padding:18px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div><div class="section-title">${t('calTitle')}</div>
      <div class="serif" style="font-size:22px;font-weight:700;margin-top:3px">${monthName(m)} <span style="color:var(--text2);font-size:15px">${y}</span></div></div>
      <div style="display:flex;gap:7px">
        <button class="btn press" style="padding:8px 13px" onclick="monthNav(-1)">←</button>
        <button class="btn press" style="padding:8px 13px;font-size:12px" onclick="S.month=new Date();render()">${t('hoje')}</button>
        <button class="btn press" style="padding:8px 13px" onclick="monthNav(1)">→</button>
      </div>
    </div>
    <div class="cal-grid">
      ${dowList().map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells.map(cell=>{
        if(!cell) return '<div></div>';
        const mk=(marks[cell.n]||[]);
        const cls=['cal-cell'];
        if(cell.iso===todayISO) cls.push('today');
        if(cell.iso===S.selDay) cls.push('sel');
        return `<button class="${cls.join(' ')}" onclick="selDay('${cell.iso}')">
          <span>${cell.n}</span>
          <span class="dotrow">${mk.slice(0,3).map(k=>k==='star'?'<i class="star">⭐</i>':`<i class="mdot" style="background:${k==='pos'?'var(--green)':k}"></i>`).join('')}</span>
        </button>`;
      }).join('')}
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:13px">
      <span class="pill green">${t('legEntrada')}</span><span class="pill">${t('legGastos')}</span>
      <span class="pill gold">${t('legComp')}</span><span class="pill gold">${t('legParcela')}</span>
    </div>
  </div>

  ${S.selDay?`
  <div class="card-sh" style="padding:18px;margin-top:16px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div class="section-title">${t('diaSel')(fmtBR(S.selDay))}</div>
      <button class="pill red press" onclick="selDay('${S.selDay}')">${t('fechar')}</button>
    </div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn press" style="flex:1;padding:11px 8px;font-size:12px" onclick="openForm('expense','${S.selDay}')">${t('btnGasto')}</button>
      <button class="btn press" style="flex:1;padding:11px 8px;font-size:12px" onclick="openForm('income','${S.selDay}')">${t('btnEntrada')}</button>
      <button class="btn press" style="flex:1;padding:11px 8px;font-size:12px" onclick="openCompForm('${S.selDay}')">${t('btnComp')}</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:14px">
      ${selItems.length?selItems.map(it=>it.kind==='tx'?txRow(it.x):compRow(it.c)).join(''):`<div style="text-align:center;color:var(--text2);font-size:12.5px;padding:12px">${t('nadaDia')}</div>`}
    </div>
  </div>`:''}

  <div style="margin-top:26px;display:flex;justify-content:space-between;align-items:center">
    <div class="section-title">${t('proximosComp')}</div>
    <button class="pill gold press" onclick="openCompForm()">${t('novo')}</button>
  </div>
  <div class="carousel slim" data-carousel="comps" style="margin-top:10px">
    ${upcoming.length?upcoming.map(c=>`
      <div class="card-sh press" style="padding:15px" onclick="editComp('${c.id}')">
        <div style="font-size:22px">📌</div>
        <div style="font-size:13.5px;font-weight:800;margin-top:8px;min-height:36px">${esc(c.title)}</div>
        <div style="font-size:11px;color:var(--text2)">${fmtBR(c.date)}${c.repeat==='monthly'?' '+t('repeteTodoMes'):''}</div>
        ${c.value?`<div class="tx-amt money-neg" style="margin-top:8px">${money(c.value)}</div>`:`<div class="pill" style="margin-top:8px">${t('semValor')}</div>`}
      </div>`).join(''):`<div class="card-sh" style="padding:22px;text-align:center;color:var(--text2);font-size:12.5px">${t('nenhumComp')}</div>`}
  </div>
  <div class="dots" data-dots="comps"></div>`;
}
function compRow(c){
  return `<div class="tx press" onclick="editComp('${c.id}')">
    <div class="tx-ic" style="background:color-mix(in srgb,var(--blue) 14%,transparent)">📌</div>
    <div style="flex:1;min-width:0">
      <div class="tx-title">${esc(c.title)} ${c.done?`<span class="pill green" style="padding:2px 8px;font-size:9px">${t('feito')}</span>`:''}</div>
      <div class="tx-meta"><span>${fmtBR(c.date)}</span>${c.repeat==='monthly'?`<span>${t('repeteTodoMes')}</span>`:''}</div>

    ${c.value?`<div class="tx-amt">${money(c.value)}</div>`:''}
    <button class="pay-btn press ${c.done?'on':''}" onclick="event.stopPropagation();toggleComp('${c.id}')">${c.done?'✓':'○'}</button>
  </div>`;
}
function selDay(ds){ S.selDay=(S.selDay===ds?null:ds); render() }
function toggleComp(id){ const c=S.comps.find(k=>k.id===id); if(c){ c.done=!c.done; save(); render(); toast(c.done?t('tCompFeito'):t('tCompReaberto')) } }

   ============================================================ */
function viewParcelas(){
  const y=S.month.getFullYear(), m=S.month.getMonth();
  const groups={};
  S.txs.filter(x=>x.kind==='debt').forEach(x=>{ const g=(x.id||'').split('_')[0]; (groups[g]=groups[g]||[]).push(x) });
  const compras=Object.values(groups).map(g=>{
    g.sort((a,b)=>(a.parcelaAtual||0)-(b.parcelaAtual||0));
    const base=g[0], paidCount=g.filter(k=>k.paid).length;
    const parcelaDoMes=g.find(k=>inMonth(k.faturaDate||k.date,y,m));
    return {base,parcelas:g,paidCount,parcelaDoMes};
  });
  const totalMes=compras.reduce((s,c)=>s+(c.parcelaDoMes?(c.parcelaDoMes.parcelaValor||c.parcelaDoMes.amount):0),0);

  return `
  <div style="margin:10px 0 4px">
    <div class="section-title">${t('minhasParcelas')}</div>
    <div class="serif" style="font-size:24px;font-weight:700;margin-top:2px">${t('comprasParceladas')}</div>
    <div style="font-size:12px;color:var(--text2);margin-top:5px">${t('parcelasSub')}</div>
  </div>

  <div class="hero" style="margin-top:16px">
    <div class="hero-label">${t('parcelasVencem')(monthName(m))}</div>
    <div class="hero-value" style="font-size:32px">${S.hide?'•••••':money(totalMes)}</div>
    <div class="hero-sub">${t('comprasComParcela')(compras.filter(c=>c.parcelaDoMes).length)}</div>
    <button class="btn btn-gold press" style="margin-top:13px;padding:10px 16px;font-size:12.5px" onclick="openForm('debt')">${t('lancarDivida')}</button>
  </div>

  <div style="display:flex;flex-direction:column;gap:12px;margin-top:20px">
    ${compras.length?compras.map(c=>{
      const b=c.base, total=b.valorTotal||b.amount, per=b.parcelaValor||b.amount;
      const pct=Math.round(c.paidCount/c.parcelas.length*100);
      return `<div class="dcard">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
          <div style="flex:1">
            <div style="font-size:16px;font-weight:800;letter-spacing:-.2px">${esc(b.title)}</div>
            <div style="font-size:11px;color:var(--text2);margin-top:3px">${esc(b.paraOnde||catName(b.categoria))} · ${fmtBR(b.date)}
              ${b.emprestado?`<span class="pill" style="margin-left:5px;padding:2px 8px;font-size:9px">${t('emprestadoDe')(esc(b.cardName||''))}</span>`:''}
            </div>
          </div>
          <div style="text-align:right">
            <div style="font-size:11px;color:var(--text2)">${t('totalDaCompra')}</div>
            <div class="tx-amt">${S.hide?'•••':money(total)}</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:9px;margin-top:13px;flex-wrap:wrap">
          <div class="pill gold" style="font-size:11.5px;padding:6px 12px">${c.parcelas.length}x ${S.lang==='en'?'of':'de'} ${S.hide?'•••':money(per)}</div>
          <div class="pill">${t('pagasN')(c.paidCount)}</div>
          <div class="pill">${t('faltandoN')(c.parcelas.length-c.paidCount)}</div>
        </div>
        <div class="pbar" style="margin-top:11px"><i style="width:${pct}%"></i></div>
        <div style="display:flex;gap:7px;margin-top:13px;overflow-x:auto">
          ${c.parcelas.map(p=>`
            <button class="press" onclick="togglePaid('${p.id}')" style="flex:0 0 auto;width:52px;padding:9px 4px;border-radius:12px;border:1.5px solid ${p.paid?'var(--green)':'var(--border)'};background:${p.paid?'color-mix(in srgb,var(--green) 13%,transparent)':'var(--panel2)'};text-align:center">
              <div style="font-size:10px;font-weight:800;color:var(--text2)">${p.parcelaAtual}ª</div>
              <div style="font-size:12px;font-weight:800;margin-top:2px">${p.paid?'✓':'○'}</div>
              <div style="font-size:8.5px;color:var(--text2);margin-top:2px">${fmtBR(p.faturaDate||p.date).slice(3)}</div>
            </button>`).join('')}
        </div>
        ${c.parcelaDoMes&&!c.parcelaDoMes.paid?`<div class="pill red" style="margin-top:11px">${t('parcelaVence')(c.parcelaDoMes.parcelaAtual,fmtBR(c.parcelaDoMes.faturaDate||c.parcelaDoMes.date),money(c.parcelaDoMes.parcelaValor||c.parcelaDoMes.amount))}</div>`:''}
      </div>`;
    }).join(''):`<div class="dcard" style="text-align:center;color:var(--text2);padding:28px">${t('nenhumaDivida')}</div>`}
  </div>`;
}

/* ---- backup para trocar de aparelho ---- */
function exportBackup(){
  const data={app:'alicerce',version:2,exportedAt:new Date().toISOString(),email:S.user,
    txs:S.txs,comps:S.comps,meta:S.meta,theme:S.theme,lang:S.lang};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`alicerce-backup-${todayISO}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  toast(t('tBackup'));
}
function importBackup(input){
  const f=input.files?.[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(!d||d.app!=='alicerce'||!Array.isArray(d.txs)) throw 0;
      S.txs=d.txs; S.comps=Array.isArray(d.comps)?d.comps:[];
      if(d.meta) S.meta=d.meta;
      if(d.theme) applyTheme(d.theme);
      if(d.lang) setLang(d.lang);
      save(); render(); toast(t('tRestaurado'));
    }catch(err){ toast(t('tBackupErro')) }
  };
  r.onerror=()=>toast(t('tBackupErro'));
  r.readAsText(f);
}

}
function onFile(input){
  const f=input.files?.[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>{
    F.anexo=e.target.result;
    const m=f.name.match(/(\d+[.,]\d{2})/);
    if(m&&!F.valor) F.valor=m[1];
    renderForm(); toast(t('tFoto'));
  };
  r.onerror=()=>toast(t('tFotoErro'));
  r.readAsDataURL(f);
}
function saveForm(){
  const val=parseFloat(String(F.valor).replace(/\./g,'').replace(',','.'));
  if(!F.title.trim()||!val||isNaN(val)||val<=0){ toast(t('fixaAviso')); return }
  const k=F.kind;
  if(F.editId){
    const x=S.txs.find(tt=>tt.id===F.editId);
    if(x) Object.assign(x,{title:F.title.trim(),amount:k==='income'?val:-val,date:F.date,categoria:F.categoria,paraOnde:F.paraOnde,recurring:F.recurring,paid:F.paid,anexo:F.anexo||x.anexo});
    save(); closeSheet(); render(); toast(t('tCorrigido')); return;
  }
  if(k==='income'){
    S.txs.unshift({id:uid(),kind:'income',title:F.title.trim(),amount:val,date:F.date,categoria:'outros',paraOnde:F.paraOnde,anexo:F.anexo,paid:true,recurring:false});
  }else if(k==='expense'){
    const n=(F.pay==='card')?Math.max(1,Math.min(24,F.parcelas||1)):1;
    if(n>1){
      const per=Math.round(val*100/n)/100;
      const closing=F.emprestado?20:F.closing, due=F.emprestado?25:F.due;
      const fd=faturaDateFor(F.date,closing,due);
      const base=uid();
      for(let i=0;i<n;i++){
        S.txs.unshift({id:`${base}_${i}`,kind:'debt',title:F.title.trim(),
          amount:per,parcelaValor:per,valorTotal:val,
          parcelas:n,parcelaAtual:i+1,
          date:F.date,faturaDate:addMonths(fd,i,due),
          categoria:F.categoria,paraOnde:F.paraOnde,
          pay:'card',cardName:F.cardName,emprestado:!!F.emprestado,
          anexo:i===0?F.anexo:null,paid:false,recurring:false});
      }
      toast(t('tSalvoDebt')(F.title,n+'x',money(per),money(val)));
      save(); closeSheet(); render(); return;
    }
    S.txs.unshift({id:uid(),kind:'expense',title:F.title.trim(),amount:val,date:F.date,categoria:F.categoria,paraOnde:F.paraOnde,anexo:F.anexo,paid:F.paid,recurring:F.recurring,
      pay:F.pay||'cash',cardName:F.pay==='card'?(F.cardName||''):'' ,emprestado:F.pay==='card'?!!F.emprestado:false});
  }else{
    const n=Math.max(1,Math.min(24,F.parcelas||1));
    const per=Math.round(val*100/n)/100;
    const closing=F.emprestado?20:F.closing, due=F.emprestado?25:F.due;
    const fd=faturaDateFor(F.firstDue,closing,due);
    const base=uid();
    for(let i=0;i<n;i++){
      S.txs.unshift({
        id:`${base}_${i}`,kind:'debt',title:F.title.trim(),
        amount:per,parcelaValor:per,valorTotal:val,
        parcelas:n,parcelaAtual:i+1,
        date:F.firstDue,faturaDate:addMonths(fd,i,due),
        categoria:F.categoria,paraOnde:F.paraOnde,
        cardName:F.emprestado?F.cardName:'',emprestado:F.emprestado,
        anexo:i===0?F.anexo:null,paid:false,recurring:false
      });
    }
    toast(t('tSalvoDebt')(F.title,n+'x',money(per),money(val)));
    save(); closeSheet(); render(); return;
  }
  save(); closeSheet(); render();
  toast(k==='income'?t('tSalvoIncome')(money(val)):t('tSalvoExpense')(F.title,money(val)));
}
function editTx(id){
  const x=S.txs.find(tt=>tt.id===id); if(!x) return;
  if(x.kind==='debt'){
    const base=(x.id||'').split('_')[0];
    openSheet(`
      <div class="sheet-title">${esc(x.title)}</div>
      <div class="sheet-sub">${t('compraParcelada')(`${x.parcelas}x ${S.lang==='en'?'of':'de'} ${money(x.parcelaValor||x.amount)}`,money(x.valorTotal||x.amount))}</div>

    return;
  }
  F={kind:x.kind,editId:x.id,title:x.title,valor:String(x.amount).replace('-',''),date:x.date,categoria:x.categoria,paraOnde:x.paraOnde,recurring:!!x.recurring,paid:!!x.paid,
     pay:x.pay||'cash',parcelas:1,cardName:x.cardName||'',emprestado:x.emprestado!==false,closing:20,due:25,anexo:x.anexo||null,firstDue:x.date};
  renderForm();

function saveDebtEdit(base){
  const title=$('#e_title').value.trim(), where=$('#e_where').value.trim();
  S.txs.forEach(tt=>{ if((tt.id||'').split('_')[0]===base){ tt.title=title; tt.paraOnde=where } });
  save(); closeSheet(); render(); toast(t('tCompraAtualizada'));
}
function deleteTx(id){
  const x=S.txs.find(tt=>tt.id===id);
  if(x&&x.kind==='debt'){
    const base=(x.id||'').split('_')[0];
    S.txs.filter(tt=>(tt.id||'').split('_')[0]===base).forEach(tt=>cloudRemove('tx',tt.id));
    S.txs=S.txs.filter(tt=>(tt.id||'').split('_')[0]!==base);
    toast(t('tCompraRemovida'));
  }else{
    cloudRemove('tx',id);
    S.txs=S.txs.filter(tt=>tt.id!==id);
    toast(t('tLancRemovido'));
  }
  save(); closeSheet(); render();
}

function saveComp(){
  if(!C.title.trim()){ toast(t('tCompVazio')); return }
  const v=parseFloat(String(C.value).replace(/\./g,'').replace(',','.'))||0;
  if(C.editId) Object.assign(S.comps.find(k=>k.id===C.editId),{title:C.title.trim(),date:C.date,value:v,repeat:C.repeat});
  else S.comps.push({id:uid(),title:C.title.trim(),date:C.date,value:v,repeat:C.repeat,done:false});
  save(); closeSheet(); render(); toast(t('tCompSalvo'));
}
function editComp(id){ const c=S.comps.find(k=>k.id===id); if(!c) return; C={editId:c.id,title:c.title,date:c.date,value:c.value?String(c.value):'',repeat:c.repeat,done:c.done}; renderCompForm() }
function deleteComp(id){ cloudRemove('comp',id); S.comps=S.comps.filter(k=>k.id!==id); save(); closeSheet(); render(); toast(t('tCompExcluido')) }

/* ---- contas locais (base para a futura assinatura) ---- */
let authMode='login';
function setAuthMode(m){ authMode=m; render() }
function hashPw(s){ let h=5381; for(let i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))|0 } return 'pw-'+(h>>>0).toString(16) }
function getAccounts(){ return LS.get('alicerce_accounts',{}) }

  <div class="login">

    <div style="position:relative">

      <div style="font-size:13px;color:#B0A48E;margin-top:12px;line-height:1.65">${t('loginDesc')}</div>
    </div>
    <!-- arte: calendário do mês flutuando -->
    <div class="login-art">
      <div class="art-cal">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div class="serif" style="font-size:15px;font-weight:700;letter-spacing:.2px">📅 ${monthName(new Date().getMonth())}</div>
          <div style="display:flex;gap:4px"><i style="width:7px;height:7px;border-radius:99px;background:var(--green)"></i><i style="width:7px;height:7px;border-radius:99px;background:#E58B7B"></i><i style="width:7px;height:7px;border-radius:99px;background:var(--gold)"></i></div>
        </div>
        <div class="art-grid">
          ${Array.from({length:35},(_,i)=>{

      <div class="art-chip art-chip2">🧾 12x ${S.lang==='en'?'of':'de'} <b style="color:var(--gold2)">R$ 179</b></div>
      <div class="art-chip art-chip3">✅ ${t('lbContasPagas')} <b>R$ 1.201</b></div>
    </div>
    <div style="margin-top:26px;position:relative">
      <div style="font-size:17px;font-weight:800;margin-bottom:4px">${signup?t('tituloSignup'):t('tituloLogin')}</div>
      <div style="font-size:11.5px;color:#B0A48E;margin-bottom:15px">${signup?t('signupSub'):t('loginSub')}</div>
      ${signup?`<div class="field"><label>${t('lbNome')}</label><input id="lg_name" placeholder="${t('phNome')}" autocomplete="name"></div>`:''}
      <div class="field"><label>${t('lbSeuEmail')}</label><input id="lg_email" type="email" placeholder="${t('phEmail')}" autocomplete="email"></div>

      ${!signup?`<div style="text-align:right;margin:-5px 0 14px"><button style="font-size:11.5px;color:var(--gold2);font-weight:700" onclick="forgotPw()">${t('esqueceu')}</button></div>`:''}

function doLogin(){
  const email=($('#lg_email')?.value||'').trim().toLowerCase();
  const pw=$('#lg_pass')?.value||'';
  if(!email||!email.includes('@')||!pw){ toast(t('errPreencha')); return }
  (async()=>{
    if(SB){
      const r=await cloudLogin(email,pw);
      if(r==='ok'){
        LS.set('alicerce_logged',email); S.user=email; authMode='login';
        await cloudLoad();
        if(!S.txs.length){ seed(); save() }
        render(); toast(t('tBemVindo')); return;
      }
      if(r!=='local'){ toast(r); return }
    }
    const acc=getAccounts()[email];
    if(!acc){ toast(t('errContaNao')); return }
    if(acc.hash!==hashPw(pw)){ toast(t('errSenha')); return }
    LS.set('alicerce_logged',email); S.user=email; authMode='login';
    if(!S.txs.length){ seed(); save() }
    render(); toast(t('tBemVindo'));
  })();
}
function doSignup(){
  const name=($('#lg_name')?.value||'').trim();
  const email=($('#lg_email')?.value||'').trim().toLowerCase();
  const pw=$('#lg_pass')?.value||'';
  if(!name||!email||!email.includes('@')||!pw){ toast(t('errPreencha')); return }
  if(pw.length<4){ toast(t('errSenhaCurta')); return }
  (async()=>{
    if(SB){
      const r=await cloudSignup(name,email,pw);
      if(r==='ok'){
        LS.set('alicerce_logged',email); S.user=email; authMode='login';
        if(!S.txs.length){ seed(); save() } else save();
        render(); toast(t('tContaCriada')); return;
      }
      if(r!=='local'){ toast(r); return }
    }
    const accs=getAccounts();
    if(accs[email]){ toast(t('errEmailJa')); return }
    accs[email]={name,hash:hashPw(pw),created:new Date().toISOString()};
    LS.set('alicerce_accounts',accs);
    LS.set('alicerce_logged',email); S.user=email; authMode='login';
    if(!S.txs.length){ seed(); save() }
    render(); toast(t('tContaCriada'));
  })();
}
function forgotPw(){
  openSheet(`
    <div class="sheet-title">🔑 ${t('esqueceu')}</div>
    <div class="sheet-sub">${t('esqueceuAviso')}</div>

    <button class="btn btn-ghost btn-block press" style="margin-top:9px" onclick="closeSheet()">${t('cancelar')}</button>`);
}

/* ============================================================
   13. CARROSSÉIS
   ============================================================ */
function bindCarousels(){
  document.querySelectorAll('[data-carousel]').forEach(el=>{
    const key=el.dataset.carousel;
    const dotsEl=document.querySelector(`[data-dots="${key}"]`);
    const kids=[...el.children];
    if(dotsEl&&kids.length>1){
      dotsEl.innerHTML=kids.map((_,i)=>`<span class="dot ${i===0?'on':''}"></span>`).join('');
      const dots=[...dotsEl.children];
      el.addEventListener('scroll',()=>{
        const idx=Math.round(el.scrollLeft/(el.scrollWidth/Math.max(1,kids.length)));
        dots.forEach((d,i)=>d.classList.toggle('on',i===Math.min(idx,kids.length-1)));
      },{passive:true});
    }
    let down=false,startX=0,startL=0,moved=false;
    el.addEventListener('pointerdown',e=>{
      if(e.pointerType==='touch') return;
      down=true;moved=false;startX=e.clientX;startL=el.scrollLeft;el.classList.add('dragging');
    });
    window.addEventListener('pointermove',e=>{
      if(!down) return;
      const dx=e.clientX-startX;
      if(Math.abs(dx)>4) moved=true;
      el.scrollLeft=startL-dx;
    });
    window.addEventListener('pointerup',()=>{ if(!down) return; down=false; el.classList.remove('dragging') });
    el.addEventListener('click',e=>{ if(moved){ e.preventDefault(); e.stopPropagation() } },true);
  });
}
