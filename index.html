        :root{
          --bg: ${sn.bg};
          --panel: ${sn.panel};
          --accent: ${sn.accent};
          --text: ${sn.text};
          --border: ${sn.border};
          --muted: ${sn.muted};
          --accent-contrast: ${sn.accentContrast};
          transition: background-color 300ms ease, color 300ms ease, border-color 300ms ease;
        }
        * { font-family: "Public Sans", system-ui, sans-serif; }
        h1,h2,h3,.fraunces { font-family: "Fraunces", serif; }
        html, body{ transition: background-color 300ms ease, color 300ms ease; }
        body{ background: var(--bg); color: var(--text); }
        .card-shadow { box-shadow: 0 14px 34px rgba(40,30,10,.08); transition: background-color 300ms ease, border-color 300ms ease, box-shadow 300ms ease; }
        .card-shadow-lg { box-shadow: 0 24px 60px rgba(40,30,10,.14); transition: background-color 300ms ease, border-color 300ms ease; }
        .ws-day { flex:1; min-width:0; border-radius:10px; border:1px solid var(--border); background: color-mix(in srgb, var(--bg) 70%, var(--panel) 30%); padding:8px 6px; text-align:center; transition: all 300ms ease; }
        .ws-day.has-items { background: color-mix(in srgb, var(--bg) 60%, var(--panel) 40%); }
        .ws-day.today { border:1.5px solid var(--text); background: var(--panel); box-shadow:0 0 0 3px rgba(30,27,22,.06); }
        .day-cell { height:72px; border-radius:14px; border:1px solid var(--border); background: var(--panel); padding:8px 9px; display:flex; flex-direction:column; justify-content:space-between; cursor:pointer; transition: all 300ms ease; }
        .day-cell:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(40,30,10,.08); }
        .day-cell.today { border:1.5px solid var(--text); box-shadow:0 0 0 4px rgba(30,27,22,.05); }
        .day-cell.weekend { background: color-mix(in srgb, var(--panel) 80%, var(--bg) 20%); }
        .day-cell.clean { background: #EAF0E7; border-color: #D6E0D2; }
        .day-cell.has-items { background: var(--panel); }
        .day-num { font-size:13px; font-weight:700; letter-spacing:-0.2px; color: var(--text); }
        .day-total { font-size:11px; font-weight:700; letter-spacing:-0.1px; }
        .day-dots { display:none; gap:3px; justify-content:center; align-items:center; }
        .day-dot { width:5px; height:5px; border-radius:50%; }
        .event-chip { display:inline-flex; font-size:9px; font-weight:700; letter-spacing:0.06em; padding:2px 6px; border-radius:999px; line-height:1; }
        .event-fixed { background:#E7EDFF; color:#3B6FE0; border:1px solid #C9D6FF; }
        .event-card { background:#EDE6FF; color:#7C5CD6; border:1px solid #D9CCFF; }
        .event-installment { background:#FFF0DF; color:#D97A1F; border:1px solid #FFE0B8; }
        .event-expense { background:#FFE9E6; color:#B14A3C; border:1px solid #FFD0CA; }
        .event-income { background:#DFF1E8; color:#1E5B3F; border:1px solid #C0E1D0; }
        .input-rich { background: color-mix(in srgb, var(--panel) 90%, var(--bg) 10%); border:1px solid var(--border); border-radius:12px; height:44px; padding:0 14px; font-size:14px; outline:none; width:100%; color: var(--text); transition: all 300ms ease; }
        .input-rich:focus { border-color: var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
        /* Atelier premium cards */
        .atelier-preset { width:100%; padding:18px; border-radius:18px; border:1px solid #E8E0D1; background:#FFFFFF; cursor:pointer; transition: all 200ms ease; }
        .atelier-preset:hover { border-color:#1A1A1A; transform: scale(1.01); box-shadow: 0 12px 32px rgba(20,15,5,.08); }
        .atelier-preset.active { border-color:#121212; box-shadow: 0 0 0 1.5px #121212, 0 12px 32px rgba(20,15,5,.10); }
        .atelier-dot { width:18px; height:18px; border-radius:50%; border:2px solid #FFFFFF; box-shadow: 0 1px 4px rgba(0,0,0,.14), 0 0 0 1px rgba(0,0,0,.06); display:inline-block; margin-left:-6px; }
        .atelier-dot:first-child { margin-left:0; }
        .atelier-pill { display:inline-flex; align-items:center; gap:7px; border:1px solid #E8E0D1; border-radius:100px; padding:8px 14px; background:#FFFFFF; cursor:pointer; transition: all 180ms ease; font-size:12px; font-weight:600; color:#1A1A1A; }
        .atelier-pill:hover { border-color:#1A1A1A; transform: translateY(-0.5px); }
        .atelier-pill.active { background:#121212; color:#FFFCF5; border-color:#121212; box-shadow: 0 4px 14px rgba(18,18,18,.18); }
        .atelier-pill-dot { width:14px; height:14px; border-radius:50%; border:1.5px solid rgba(255,255,255,.9); box-shadow: 0 1px 3px rgba(0,0,0,.18); display:inline-block; flex-shrink:0; }
        @media (max-width: 520px){
          .day-cell { height:56px; padding:6px 5px; border-radius:12px; }
          .day-num { font-size:12px; }
          .day-total, .day-items { display:none !important; }

          .balance-figure { font-size:44px !important; }

          .hero-secondary > div:last-child { grid-column: span 2; border-top:1px solid var(--border); padding-top:12px; margin-top:4px; }
        }
